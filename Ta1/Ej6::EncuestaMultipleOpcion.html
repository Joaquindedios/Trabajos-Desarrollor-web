<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="author" content="Joa" />
        <title> Registro de aeronaves</title>
    </head>
    <body>
          <h1> Registre su avión favorito</h1>
        <form>
        <label for="compania"> airbus/boeing:</label>
        <input type="text" id="compania" name="compania"><br/><br/>

        <label for="modelo"> Modelo:</label>
        <input type="text" id="modelo" name="modelo"><br/><br/>

        <label for="aerolínea"> aerolinea:</label>
        <input type="text" id="aerolinea" name="aerolinea"><br/><br/>


        <label> Qué otros aviones te gustan?</label><br/><br/>
        <label for="a340"> A340</label>
        <input type="checkbox" id="a340" name="aviones"><br/>
        <label for="a380"> A380</label>
        <input type="checkbox" id="a380" name="aviones"><br/>
        <label for="a330"> A330</label>
        <input type="checkbox" id="a330" name="aviones"><br/> <br/>

        <label> Te gustó este formulario?</label><br/><br/>
        <label for="si"> si</label>
        <input type="radio" id="si" name="si"><br/>
        <label for="no"> no</label>
        <input type="radio" id="no" name="no"><br/><br/>

        <input type="submit" value="enviar">
        <input type="reset" value="restablecer">

    </body>
</html>
